name: Build VPK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  host-check:
    # быстрая проверка логики на обычном Linux: тесты аккордов/струн, синт в WAV, превью экрана
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tests
        run: make -C host test
      - uses: actions/upload-artifact@v4
        with:
          name: host-preview
          path: |
            host/out/*.ppm
            host/out/*.wav

  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:2026.08
    steps:
      - uses: actions/checkout@v4
      - name: MIDI по USB (клиент плагина psvita-usb-audio-midi из VitaMIDI)
        shell: bash
        run: |
          set -o pipefail
          cmake -S third_party/psvita-usb-audio-midi -B build-usb \
            -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake -DPSVITA_USB_AUDIO_MIDI_VITA=ON
          cmake --build build-usb --target psvita_usb_audio_midi_client.suprx-self public_stub_aliases -- -j2
          ls build-usb/*.suprx build-usb/*.a
      - name: Build
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake
          cmake --build build
      - name: Имя VPK с версией
        id: ver
        run: |
          V=$(sed -n 's/.*set(VITA_VERSION *"\([0-9.]*\)").*/\1/p' CMakeLists.txt | head -1 | sed 's/^0*\([0-9]\)/\1/')
          N=$(basename "$(ls build/*.vpk | head -1)" .vpk)
          cp "build/$N.vpk" "build/$N-v$V.vpk"
          echo "ver=$V" >> "$GITHUB_OUTPUT"
          echo "name=$N-v$V" >> "$GITHUB_OUTPUT"
          echo "file=build/$N-v$V.vpk" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.name }}
          path: ${{ steps.ver.outputs.file }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.ver }}
          name: ${{ steps.ver.outputs.name }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: ${{ steps.ver.outputs.file }}
